[project]
name = "ifc-ruhsat"
version = "0.2.1"
description = "Yapı ruhsatı IFC modelini Türkiye'nin dijital proje yönetmeliğine (RG 5.8.2026, 33331) göre kontrol eder — CLI ve MCP sunucusu. Checks an IFC model against Türkiye's building-permit BIM regulation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Berkant Acun" }]
keywords = ["ifc", "bim", "mcp", "ruhsat", "e-pys", "yönetmelik", "ids", "ifcopenshell", "türkiye"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Turkish",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "ifcopenshell>=0.8.4",
  "ifctester>=0.8.4",
  "mcp>=2.0",
]

[project.urls]
Homepage = "https://github.com/BerkantACUN/ifc-ruhsat"
Issues = "https://github.com/BerkantACUN/ifc-ruhsat/issues"

[project.scripts]
ifc-ruhsat = "ifc_ruhsat.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ifc_ruhsat"]

[tool.hatch.build.targets.sdist]
include = ["src/ifc_ruhsat", "ids", "README.md", "LICENSE", "KAYNAKLAR.md", "CHANGELOG.md"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # uzun Türkçe mesajlar; biçimlendirme ruff format ile

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
